name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bilibili-hot100-backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bilibili-hot100-backend/requirements.txt
          python -m pip install -r bilibili-hot100-backend/requirements-dev.txt
      - name: Lint (ruff check + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests
        working-directory: bilibili-hot100-backend
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend (typecheck + unit + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bilibili-hot100-vue3-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bilibili-hot100-vue3-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx vite build

  e2e:
    name: E2E (offline fixture)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bilibili-hot100-backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bilibili-hot100-vue3-ts/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r bilibili-hot100-backend/requirements.txt
      - name: Install frontend dependencies and browser
        working-directory: bilibili-hot100-vue3-ts
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Seed offline snapshot
        run: |
          python bilibili-hot100-backend/tests/make_fixture.py data/snapshot.json
      - name: Start backend
        env:
          BILIBILI_PRELOAD: "0"
          BILIBILI_DATA_DIR: ${{ github.workspace }}/data
        run: |
          cd bilibili-hot100-backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
      - name: Start frontend
        working-directory: bilibili-hot100-vue3-ts
        run: nohup npm run dev -- --host 127.0.0.1 --port 3000 &
      - name: Wait for services
        run: |
          for url in http://127.0.0.1:8000/api/status http://127.0.0.1:3000; do
            for attempt in $(seq 1 60); do
              if curl --silent --fail --max-time 2 "$url" >/dev/null; then break; fi
              sleep 1
            done
            curl --silent --fail --max-time 2 "$url" >/dev/null || { echo "$url not ready"; exit 1; }
          done
      - name: Run Playwright
        working-directory: bilibili-hot100-vue3-ts
        run: npx playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bilibili-hot100-vue3-ts/test-results
          retention-days: 7
